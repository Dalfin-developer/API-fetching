<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Random User </title>
</head>
<body>
    
    <h1 class="text-center text-primary mt-4">Random User Profile</h1>
    
    <div class="my-4 container d-flex flex-column gap-3 align-items-center">

        <div class="card shadow" style="width: 18rem;">
            <img id="userImage" class="card-img-top" src="" alt="...">
            <div class="card-body text-center">
                <h5 id="userName" class="card-title fw-bold">name</h5>
                <p id="userEmail" class="card-text  mb-1 fw-light">email</p>
                <p id="userLocation" class="card-text">location</p>
            </div>
        </div>

        <button id="btnClick" onclick="fetchUser()" class="btn btn-primary">Get New User</button>
    </div>

<script>
    async function fetchUser() {
        try {
            
            const response = await fetch("https://randomuser.me/api/");
            
            
            const data = await response.json();
            console.log(data);         
            
            
            const user = data.results[0];
            console.log(user); 

            userImage.src = user.picture.large;
            userName.textContent = `${user.name.first} ${user.name.last}`;
            userEmail.textContent = user.email;
            userLocation.textContent = `${user.location.city}, ${user.location.country}`;
            
        } catch (error) {
            console.error("Error :", error);
            
        }
    }

    fetchUser();
</script>
</body>
</html>
